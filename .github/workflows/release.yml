name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Request the reviewed first release PR or recover a failed draft release
        required: true
        type: choice
        options:
          - first-release
          - recover
      release_as:
        description: Use 0.1.0 only for the first release PR
        required: false
        type: string
      tag:
        description: Existing vX.Y.Z draft tag to recover
        required: false
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Validate workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_AS: ${{ inputs.release_as }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || {
            echo "Run release operations from main." >&2
            exit 1
          }
          case "$OPERATION" in
            first-release)
              test "$RELEASE_AS" = 0.1.0 || {
                echo "The first release trigger must request version 0.1.0." >&2
                exit 1
              }
              test -z "$TAG" || {
                echo "Do not supply a tag when requesting the first release PR." >&2
                exit 1
              }
              set +e
              git ls-remote --exit-code --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/tags/v0.1.0 >/dev/null
              tag_status=$?
              set -e
              if [[ "$tag_status" == 0 ]]; then
                echo "Tag v0.1.0 already exists; do not start the first-release flow." >&2
                exit 1
              elif [[ "$tag_status" != 2 ]]; then
                echo "Could not verify that tag v0.1.0 is absent." >&2
                exit 1
              fi
              ;;
            recover)
              test -z "$RELEASE_AS" || {
                echo "Recovery does not accept a version override." >&2
                exit 1
              }
              [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
                echo "Recovery requires an existing vX.Y.Z tag." >&2
                exit 1
              }
              ;;
            *)
              echo "Unknown release operation." >&2
              exit 1
              ;;
          esac

      - name: Create first release PR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'first-release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AS: ${{ inputs.release_as }}
        run: |
          set -euo pipefail
          npm exec --yes --package=release-please@17.3.0 -- release-please release-pr \
            --repo-url="$GITHUB_REPOSITORY" \
            --target-branch=main \
            --token="$GH_TOKEN" \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json \
            --release-as="$RELEASE_AS"

      - uses: googleapis/release-please-action@v4
        id: release
        if: ${{ github.event_name == 'push' }}
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package-release:
    name: package-verify-publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'recover') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Validate selected tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RECOVERY_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$OPERATION" == recover ]]; then
            test -z "$RELEASE_CREATED"
            [[ "$RECOVERY_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test -z "$RELEASE_VERSION"
          else
            test "$RELEASE_CREATED" = true
            test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          fi

      - name: Select tag
        id: select-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch && "$OPERATION" == recover ]]; then
            echo "tag=$RECOVERY_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.select-tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Verify tag, draft, and version
        id: resolve-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select-tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          tag_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_sha" origin/main || {
            echo "Release tag is not reachable from main." >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == push ]]; then
            test "$RELEASE_CREATED" = true
            test "$tag_sha" = "$RELEASE_SHA"
            test "$tag_sha" = "$EVENT_SHA"
          else
            test "$OPERATION" = recover
          fi
          python3 - "$RELEASE_TAG" <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          tag = sys.argv[1]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if not match:
              raise SystemExit(f"Invalid release tag: {tag}")
          version = match.group(1) + "." + match.group(2) + "." + match.group(3)
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          if manifest["package"]["version"] != version:
              raise SystemExit("Release tag does not match Cargo.toml")
          PY
          git show "$WORKFLOW_SHA:scripts/resolve_release.py" > "$RUNNER_TEMP/resolve_release.py"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          release_id="$(python3 "$RUNNER_TEMP/resolve_release.py" --tag "$RELEASE_TAG" --releases-json "$RUNNER_TEMP/releases.json")"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-before.json"
          python3 "$RUNNER_TEMP/resolve_release.py" \
            --tag "$RELEASE_TAG" \
            --release-json "$RUNNER_TEMP/release-before.json" \
            --expected-id "$release_id" > /dev/null
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Build Linux x86_64 executable
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu --bin creds

      - name: Package assets and smoke check the extracted executable
        env:
          RELEASE_TAG: ${{ steps.select-tag.outputs.tag }}
        run: |
          set -euo pipefail
          binary="target/x86_64-unknown-linux-gnu/release/creds"
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          python3 scripts/package_release.py \
            --version "$version" \
            --binary "$binary" \
            --output-dir dist
          extract_dir="$RUNNER_TEMP/creds-package-smoke"
          mkdir -p "$extract_dir"
          tar -xzf "dist/creds-v${version}-x86_64-unknown-linux-gnu.tar.gz" -C "$extract_dir"
          packaged_binary="$extract_dir/creds-v${version}-x86_64-unknown-linux-gnu/creds"
          file "$packaged_binary" | grep -E 'ELF 64-bit.*x86-64'
          readelf -h "$packaged_binary" | grep -E 'Machine:.*Advanced Micro Devices X86-64'
          if ldd "$packaged_binary" | grep -F 'not found'; then
            echo "The packaged executable has an unresolved dynamic library." >&2
            exit 1
          fi
          "$packaged_binary" --help >/dev/null
          cd dist
          sha256sum "creds-v${version}-x86_64-unknown-linux-gnu.tar.gz" "creds-web-v${version}.zip" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Remove existing draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select-tag.outputs.tag }}
          RELEASE_ID: ${{ steps.resolve-release.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-before-assets.json"
          python3 "$RUNNER_TEMP/resolve_release.py" \
            --tag "$RELEASE_TAG" \
            --release-json "$RUNNER_TEMP/release-before-assets.json" \
            --expected-id "$RELEASE_ID" > /dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[] | .id' > "$RUNNER_TEMP/release-asset-ids.txt"
          while IFS= read -r asset_id; do
            [[ -n "$asset_id" ]] || continue
            [[ "$asset_id" =~ ^[0-9]+$ ]] || {
              echo "GitHub returned an invalid release asset ID." >&2
              exit 1
            }
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < "$RUNNER_TEMP/release-asset-ids.txt"

      - name: Upload assets to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select-tag.outputs.tag }}
          RELEASE_ID: ${{ steps.resolve-release.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-before-upload.json"
          python3 "$RUNNER_TEMP/resolve_release.py" \
            --tag "$RELEASE_TAG" \
            --release-json "$RUNNER_TEMP/release-before-upload.json" \
            --expected-id "$RELEASE_ID" > /dev/null
          version="${RELEASE_TAG#v}"
          for asset in \
            "dist/creds-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/creds-web-v${version}.zip" \
            dist/SHA256SUMS; do
            asset_name="${asset##*/}"
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              --output /dev/null \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$asset_name"
          done

      - name: Download and verify every uploaded byte
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select-tag.outputs.tag }}
          RELEASE_ID: ${{ steps.resolve-release.outputs.id }}
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$download_dir"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-after.json"
          python3 "$RUNNER_TEMP/resolve_release.py" \
            --tag "$RELEASE_TAG" \
            --release-json "$RUNNER_TEMP/release-after.json" \
            --expected-id "$RELEASE_ID" > /dev/null
          python3 - "$RUNNER_TEMP/release-after.json" "$RELEASE_TAG" "$RELEASE_ID" > "$RUNNER_TEMP/release-assets.tsv" <<'PY'
          import json
          import sys

          from scripts.verify_release_assets import expected_asset_names

          release = json.load(open(sys.argv[1], encoding="utf-8"))
          tag = sys.argv[2]
          release_id = int(sys.argv[3])
          if (
              release.get("id") != release_id
              or release.get("tag_name") != tag
              or release.get("draft") is not True
          ):
              raise SystemExit("Release changed before asset download; expected the matching draft")
          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("GitHub release response has no valid asset list")
          expected = set(expected_asset_names(tag))
          names = [asset.get("name") for asset in assets if isinstance(asset, dict)]
          if len(names) != len(assets) or len(names) != len(set(names)) or set(names) != expected:
              raise SystemExit("Uploaded release assets do not match the required set")
          for asset in assets:
              asset_id = asset.get("id")
              name = asset["name"]
              if type(asset_id) is not int or asset_id <= 0:
                  raise SystemExit("GitHub release response has an invalid asset ID")
              print(f"{asset_id}\t{name}")
          PY
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            curl --fail --silent --show-error --location \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$download_dir/$asset_name" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done < "$RUNNER_TEMP/release-assets.tsv"
          python3 scripts/verify_release_assets.py \
            --tag "$RELEASE_TAG" \
            --local-dir dist \
            --downloaded-dir "$download_dir" \
            --release-json "$RUNNER_TEMP/release-after.json"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select-tag.outputs.tag }}
          RELEASE_ID: ${{ steps.resolve-release.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-before-publish.json"
          python3 "$RUNNER_TEMP/resolve_release.py" \
            --tag "$RELEASE_TAG" \
            --release-json "$RUNNER_TEMP/release-before-publish.json" \
            --expected-id "$RELEASE_ID" > /dev/null
          python3 scripts/verify_release_assets.py \
            --tag "$RELEASE_TAG" \
            --local-dir dist \
            --downloaded-dir "$RUNNER_TEMP/release-assets" \
            --release-json "$RUNNER_TEMP/release-before-publish.json"
          gh api --method PATCH -F draft=false \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release-published.json"
          python3 "$RUNNER_TEMP/resolve_release.py" \
            --tag "$RELEASE_TAG" \
            --release-json "$RUNNER_TEMP/release-published.json" \
            --expected-id "$RELEASE_ID" \
            --expected-state published > /dev/null
