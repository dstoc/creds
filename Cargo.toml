[package]
name = "creds"
version = "0.3.0"
edition = "2024"
description = "Browser-approved credential encryption"
license = "MIT"

[workspace]
members = [".", "qr-rendering"]
resolver = "3"

[features]
dev-tools = []

[[bin]]
name = "creds-probe-server"
path = "dev/transport_probe.rs"
required-features = ["dev-tools"]

[dependencies]
base64 = "0.23.1"
aes-gcm = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
ciborium = "0.2.2"
fs2 = "0.4.3"
getrandom = "0.4.3"
hkdf = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
creds-qr-rendering = { path = "qr-rendering" }
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = "0.3.55"
toml = "1.1.8"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
wtransport = "0.7.2"
zeroize = "1.9.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
